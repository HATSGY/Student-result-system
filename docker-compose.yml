# Local development / smoke testing.
#   docker compose up --build
#   Frontend:           http://localhost:8080   (talks to the API URL set below)
#   Lambda (RIE):       http://localhost:9000/2015-03-31/functions/function/invocations
#   DynamoDB Local:     http://localhost:8000
services:
  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "8081:80"

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: [ "-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb" ]
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    ports:
      - "9001:8081"
    environment:
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-local-passcode}
      TABLE_NAME: StudentResults
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000 # boto3 reads this automatically
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-2
    depends_on:
      - dynamodb

  # One-shot helper: creates the table in DynamoDB Local.
  init-table:
    image: amazon/aws-cli:latest
    entrypoint: [ "sh", "-c" ]
    command:
      - >
        aws dynamodb create-table --table-name StudentResults --attribute-definitions AttributeName=rollNumber,AttributeType=S --key-schema AttributeName=rollNumber,KeyType=HASH --billing-mode PAY_PER_REQUEST --endpoint-url http://dynamodb:8000 || true
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-2
    depends_on:
      - dynamodb
